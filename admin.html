<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internal Admin | CredCheck</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #0b0b0c;
      --panel: #151517;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --border: rgba(255, 255, 255, 0.09);
      --strong-border: rgba(255, 255, 255, 0.16);
      --accent: #f4f4f5;
      --accent-hover: #ffffff;
      --error: #f97316;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
    }

    nav {
      align-items: center;
      background: rgba(13, 13, 14, 0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
      display: flex;
      justify-content: space-between;
      padding: 0.85rem 2rem;
    }

    nav a {
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 750;
      text-decoration: none;
    }

    nav a:hover {
      color: var(--accent);
    }

    main {
      margin: 0 auto;
      max-width: 740px;
      padding: 2.35rem 1.5rem;
    }

    .header {
      margin-bottom: 1.5rem;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0;
      margin: 0 0 0.45rem;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.65rem);
      line-height: 1.06;
      margin: 0;
    }

    .note {
      color: var(--muted);
      line-height: 1.6;
      margin: 0.9rem 0 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    form {
      display: grid;
      gap: 1rem;
    }

    label {
      display: grid;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
    }

    input,
    textarea {
      background: #111;
      border: 1px solid var(--strong-border);
      border-radius: 10px;
      color: var(--text);
      font: inherit;
      padding: 0.8rem 0.9rem;
      width: 100%;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
      outline: none;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .field-group {
      display: grid;
      gap: 0.55rem;
    }

    .field-label {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
    }

    .niche-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .niche-chip {
      background: #111;
      border: 1px solid var(--strong-border);
      border-radius: 999px;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.45rem 0.75rem;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .niche-chip:hover {
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .niche-chip.active {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--accent);
      color: var(--text);
    }

    .custom-niche-row {
      display: flex;
      gap: 0.5rem;
    }

    .custom-niche-row input {
      flex: 1;
    }

    .custom-niche-row button {
      flex: 0 0 auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    .selected-niches {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
      min-height: 1.25rem;
    }

    button {
      background: var(--accent);
      border: 0;
      border-radius: 999px;
      color: #111113;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      padding: 0.85rem 1.2rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    .message {
      border-radius: 8px;
      display: none;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
    }

    .message.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: var(--success);
      display: block;
    }

    .message.error {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.35);
      color: var(--error);
      display: block;
    }

    @media (max-width: 640px) {
      nav {
        padding: 0.95rem 1rem;
      }

      main {
        padding: 2rem 1rem;
      }

      .panel {
        padding: 1rem;
      }

      .custom-niche-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div style="font-size: 1.25rem; font-weight: 800;">CredCheck</div>
    <a href="index.html">Directory</a>
  </nav>

  <main>
    <section class="header">
      <p class="eyebrow">Internal MVP</p>
      <h1>Add a course or guru.</h1>
      <p class="note">This page is internal only for now. No auth has been added yet, so keep it off public navigation.</p>
    </section>

    <section class="panel">
      <form id="courseForm">
        <label>
          Title
          <input type="text" id="title" name="title" placeholder="Agency Launchpad" required />
        </label>

        <label>
          Creator name
          <input type="text" id="creator_name" name="creator_name" placeholder="Marcus Reed" />
        </label>

        <div class="field-group">
          <div class="field-label">Niche</div>
          <div class="niche-grid" id="nicheGrid" aria-label="Common niches"></div>
          <div class="custom-niche-row">
            <input type="text" id="customNiche" placeholder="Other niche" />
            <button type="button" id="addCustomNiche">Add other</button>
          </div>
          <div class="selected-niches" id="selectedNiches">No niches selected yet.</div>
        </div>

        <label>
          Description
          <textarea id="description" name="description" placeholder="Short, honest description of what this program teaches."></textarea>
        </label>

        <label>
          Thumbnail URL
          <input type="url" id="thumbnail_url" name="thumbnail_url" placeholder="https://images.unsplash.com/..." />
        </label>

        <button type="submit" id="submitButton">Add course</button>
      </form>

      <div id="message" class="message" role="status"></div>
    </section>
  </main>

  <script>
    const API_BASE = window.CREDCHECK_API_BASE;
    const form = document.getElementById("courseForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const nicheGrid = document.getElementById("nicheGrid");
    const customNiche = document.getElementById("customNiche");
    const addCustomNiche = document.getElementById("addCustomNiche");
    const selectedNiches = document.getElementById("selectedNiches");
    const commonNiches = [
      "SMMA",
      "Marketing",
      "Online Business",
      "Amazon FBA",
      "E-Commerce",
      "Dropshipping",
      "Copywriting",
      "Finance",
      "Investing",
      "AI Tools",
      "Creator Business",
      "Sales",
      "Mindset",
      "Coaching",
      "Productivity",
    ];
    const nicheSet = new Set();

    function setMessage(type, text) {
      message.className = `message ${type}`;
      message.textContent = text;
    }

    function renderSelectedNiches() {
      selectedNiches.textContent = nicheSet.size
        ? `Selected: ${Array.from(nicheSet).join(", ")}`
        : "No niches selected yet.";
    }

    function addNiche(niche) {
      const cleanNiche = niche.trim();
      if (!cleanNiche) return;
      nicheSet.add(cleanNiche);
      syncNicheButtons();
      renderSelectedNiches();
    }

    function toggleNiche(niche) {
      if (nicheSet.has(niche)) {
        nicheSet.delete(niche);
      } else {
        nicheSet.add(niche);
      }
      syncNicheButtons();
      renderSelectedNiches();
    }

    function syncNicheButtons() {
      document.querySelectorAll(".niche-chip").forEach((button) => {
        const isActive = nicheSet.has(button.dataset.niche);
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    }

    commonNiches.forEach((niche) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "niche-chip";
      button.dataset.niche = niche;
      button.textContent = niche;
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => toggleNiche(niche));
      nicheGrid.appendChild(button);
    });

    addCustomNiche.addEventListener("click", () => {
      addNiche(customNiche.value);
      customNiche.value = "";
      customNiche.focus();
    });

    customNiche.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        addCustomNiche.click();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "message";
      message.textContent = "";
      submitButton.disabled = true;
      submitButton.textContent = "Adding...";

      const payload = {
        title: form.title.value.trim(),
        creator_name: form.creator_name.value.trim() || null,
        niche: Array.from(nicheSet).join(", ") || null,
        description: form.description.value.trim() || null,
        thumbnail_url: form.thumbnail_url.value.trim() || null,
      };

      try {
        const res = await fetch(`${API_BASE}/api/courses`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || "Could not add course.");
        }

        form.reset();
        nicheSet.clear();
        syncNicheButtons();
        renderSelectedNiches();
        setMessage("success", "Course added successfully.");
      } catch (err) {
        console.error(err);
        setMessage("error", err.message || "Something went wrong. Try again.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Add course";
      }
    });

    renderSelectedNiches();
  </script>
</body>
</html>
